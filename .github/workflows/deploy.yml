name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # FTPS (explicit TLS) — the encrypted variant of the same FTP
      # credentials cPanel gives you under FTP Accounts. If your host
      # doesn't support FTPS, change `protocol` below to `ftp`.
      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

      # Diagnostic only — checks the live site right after upload so a
      # broken path/permissions/caching issue shows up in this log instead
      # of requiring someone to check the browser by hand. Safe to remove
      # once the site is confirmed stable.
      - name: Check live site
        if: always()
        run: |
          sleep 10
          for url in \
            "https://wassermech.com/" \
            "https://wassermech.com/about" \
            "https://wassermech.com/assets/wassermech-logo-trimmed.png" \
            "https://wassermech.com/assets/fluenta-bathroom.png" \
            "https://wassermech.com/assets/pestan-blue-fittings.png"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$url")
            size=$(curl -s -o /dev/null -w "%{size_download}" -L "$url")
            echo "$code  ${size} bytes  $url"
          done
